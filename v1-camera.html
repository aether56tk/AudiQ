<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AudiQ V1 Camera</title><style>body{font-family:system-ui;margin:0;padding:20px;background:#f5f7fb;color:#152033}.card{max-width:700px;margin:auto;background:white;padding:20px;border-radius:16px}button{padding:12px 16px;margin:5px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700}button.secondary{background:#e8edf5;color:#152033}video,img{width:100%;max-height:500px;object-fit:contain;border-radius:12px;background:#111;margin-top:12px}#status{padding:12px;margin-top:12px;background:#f1f5f9;border-radius:10px}</style></head><body><div class="card"><h1>📷 AudiQ — Audiogram Photo</h1><p>Camera permission is requested only when you tap Open Camera. The image stays in this browser in V1.</p><button id="open">📸 Open Camera</button><button id="upload" class="secondary">📁 Upload Photo</button><input id="file" type="file" accept="image/*" capture="environment" hidden><video id="video" autoplay playsinline hidden></video><img id="preview" hidden><div><button id="capture" hidden>Capture Audiogram</button><button id="close" class="secondary" hidden>Close Camera</button></div><div id="status">Ready.</div></div><script>let stream=null;const $=id=>document.getElementById(id);$('open').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){$('status').textContent='Camera API is unavailable. Use HTTPS and a supported browser.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('video').hidden=false;$('capture').hidden=false;$('close').hidden=false;$('status').textContent='Camera active. Point at the audiogram and tap Capture Audiogram.'}catch(e){$('status').textContent='Camera permission was not granted. Check browser/site camera permissions.'}};$('capture').onclick=()=>{const v=$('video'),c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);$('preview').src=c.toDataURL('image/jpeg',.9);$('preview').hidden=false;stop();$('status').textContent='Audiogram captured. Verify extracted thresholds before clinical use.'};$('close').onclick=stop;function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').hidden=true;$('capture').hidden=true;$('close').hidden=true}$('upload').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').hidden=false;$('status').textContent='Photo loaded. Verify every threshold before clinical use.'};r.readAsDataURL(f)};</script></body></html>
